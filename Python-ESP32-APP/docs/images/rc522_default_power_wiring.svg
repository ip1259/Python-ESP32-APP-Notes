<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">預設接線：ESP32 供電給 RC522</title>
  <desc id="desc">NodeMCU-32S 相容 ESP32 以 3V3 和 GND 供應 RC522，並以 GPIO 5、18、23、19、22 連接 SPI 與重設腳位。</desc>
  <style>
    .title { font: 700 34px sans-serif; fill: #172554; }
    .subtitle { font: 20px sans-serif; fill: #334155; }
    .board-title { font: 700 25px sans-serif; fill: #fff; }
    .board-subtitle { font: 16px sans-serif; fill: #fff; }
    .pin { font: 700 18px monospace; fill: #1e293b; }
    .label { font: 18px sans-serif; fill: #1e293b; }
    .note { font: 700 19px sans-serif; fill: #991b1b; }
    .small { font: 16px sans-serif; fill: #475569; }
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="65" class="title">預設接線：ESP32 供電</text>
  <text x="60" y="102" class="subtitle">先拔除 USB 再接線。RC522 的 3.3V 接 ESP32 的 3V3；不可接 5V。</text>

  <rect x="70" y="155" width="350" height="500" rx="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <rect x="70" y="155" width="350" height="58" rx="20" fill="#0369a1"/>
  <text x="245" y="185" text-anchor="middle" class="board-title">ESP32</text>
  <text x="245" y="205" text-anchor="middle" class="board-subtitle">NodeMCU-32S 相容開發板</text>
  <text x="105" y="265" class="pin">3V3</text><circle cx="390" cy="258" r="9" fill="#dc2626"/>
  <text x="105" y="325" class="pin">GND</text><circle cx="390" cy="318" r="9" fill="#111827"/>
  <text x="105" y="385" class="pin">GPIO 5</text><circle cx="390" cy="378" r="9" fill="#2563eb"/>
  <text x="105" y="445" class="pin">GPIO 18</text><circle cx="390" cy="438" r="9" fill="#16a34a"/>
  <text x="105" y="505" class="pin">GPIO 23</text><circle cx="390" cy="498" r="9" fill="#ca8a04"/>
  <text x="105" y="565" class="pin">GPIO 19</text><circle cx="390" cy="558" r="9" fill="#9333ea"/>
  <text x="105" y="625" class="pin">GPIO 22</text><circle cx="390" cy="618" r="9" fill="#ea580c"/>

  <rect x="775" y="155" width="350" height="500" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <rect x="775" y="155" width="350" height="58" rx="20" fill="#1d4ed8"/>
  <text x="950" y="185" text-anchor="middle" class="board-title">RC522</text>
  <text x="950" y="205" text-anchor="middle" class="board-subtitle">RFID 模組</text>
  <circle cx="805" cy="258" r="9" fill="#dc2626"/><text x="835" y="265" class="pin">3.3V</text>
  <circle cx="805" cy="318" r="9" fill="#111827"/><text x="835" y="325" class="pin">GND</text>
  <circle cx="805" cy="378" r="9" fill="#2563eb"/><text x="835" y="385" class="pin">SDA / SS</text>
  <circle cx="805" cy="438" r="9" fill="#16a34a"/><text x="835" y="445" class="pin">SCK</text>
  <circle cx="805" cy="498" r="9" fill="#ca8a04"/><text x="835" y="505" class="pin">MOSI</text>
  <circle cx="805" cy="558" r="9" fill="#9333ea"/><text x="835" y="565" class="pin">MISO</text>
  <circle cx="805" cy="618" r="9" fill="#ea580c"/><text x="835" y="625" class="pin">RST</text>
  <text x="955" y="365" class="small">IRQ：不接</text>

  <path d="M399 258 H796" stroke="#dc2626" stroke-width="8" fill="none"/><text x="525" y="246" class="label">電源</text>
  <path d="M399 318 H796" stroke="#111827" stroke-width="8" fill="none"/><text x="525" y="306" class="label">共地</text>
  <path d="M399 378 H796" stroke="#2563eb" stroke-width="8" fill="none"/>
  <path d="M399 438 H796" stroke="#16a34a" stroke-width="8" fill="none"/>
  <path d="M399 498 H796" stroke="#ca8a04" stroke-width="8" fill="none"/>
  <path d="M399 558 H796" stroke="#9333ea" stroke-width="8" fill="none"/>
  <path d="M399 618 H796" stroke="#ea580c" stroke-width="8" fill="none"/>

  <rect x="70" y="690" width="1055" height="45" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="95" y="721" class="note">RC522 板上的 SDA / SS 是 SPI 的片選腳位，不是 I2C SDA；只使用 3.3V，不接 5V。</text>
</svg>
