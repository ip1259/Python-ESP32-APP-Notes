<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">例外接線：外接 3.3V 供應 RC522</title>
  <desc id="desc">只在 ESP32 板載 3.3V 供電不足時使用。外接電源的 3.3V 只接 RC522，外接電源、ESP32 和 RC522 的 GND 共地；五條 SPI 與重設線仍從 ESP32 接到 RC522。</desc>
  <style>
    .title { font: 700 34px sans-serif; fill: #991b1b; }
    .subtitle { font: 20px sans-serif; fill: #334155; }
    .board-title { font: 700 26px sans-serif; fill: #ffffff; }
    .board-subtitle { font: 17px sans-serif; fill: #ffffff; }
    .pin { font: 700 19px monospace; fill: #1e293b; }
    .label { font: 18px sans-serif; fill: #1e293b; }
    .note { font: 700 19px sans-serif; fill: #991b1b; }
    .small { font: 16px sans-serif; fill: #475569; }
  </style>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="60" y="62" class="title">例外接線：供電不足時才使用外接電源</text>
  <text x="60" y="98" class="subtitle">ESP32 由 USB 供電；外接電源只供應 RC522 的 3.3V，三者 GND 必須共地。</text>

  <rect x="70" y="155" width="340" height="500" rx="20" fill="#e0f2fe" stroke="#0369a1" stroke-width="4"/>
  <rect x="70" y="155" width="340" height="70" rx="20" fill="#0369a1"/>
  <text x="240" y="185" text-anchor="middle" class="board-title">ESP32</text>
  <text x="240" y="210" text-anchor="middle" class="board-subtitle">NodeMCU-32S 相容開發板（USB 供電）</text>
  <text x="105" y="307" class="pin">GND</text><circle cx="410" cy="300" r="10" fill="#111827"/>
  <text x="105" y="367" class="pin">GPIO 5</text><circle cx="410" cy="360" r="10" fill="#2563eb"/>
  <text x="105" y="427" class="pin">GPIO 18</text><circle cx="410" cy="420" r="10" fill="#16a34a"/>
  <text x="105" y="487" class="pin">GPIO 23</text><circle cx="410" cy="480" r="10" fill="#ca8a04"/>
  <text x="105" y="547" class="pin">GPIO 19</text><circle cx="410" cy="540" r="10" fill="#9333ea"/>
  <text x="105" y="607" class="pin">GPIO 22</text><circle cx="410" cy="600" r="10" fill="#ea580c"/>
  <text x="105" y="640" class="small">ESP32 的 3V3：此圖不接 RC522</text>

  <rect x="990" y="155" width="340" height="500" rx="20" fill="#eff6ff" stroke="#1d4ed8" stroke-width="4"/>
  <rect x="990" y="155" width="340" height="70" rx="20" fill="#1d4ed8"/>
  <text x="1160" y="185" text-anchor="middle" class="board-title">RC522</text>
  <text x="1160" y="210" text-anchor="middle" class="board-subtitle">RFID 模組</text>
  <circle cx="990" cy="240" r="10" fill="#dc2626"/><text x="1020" y="247" class="pin">3.3V</text>
  <circle cx="990" cy="300" r="10" fill="#111827"/><text x="1020" y="307" class="pin">GND</text>
  <circle cx="990" cy="360" r="10" fill="#2563eb"/><text x="1020" y="367" class="pin">SDA / SS</text>
  <circle cx="990" cy="420" r="10" fill="#16a34a"/><text x="1020" y="427" class="pin">SCK</text>
  <circle cx="990" cy="480" r="10" fill="#ca8a04"/><text x="1020" y="487" class="pin">MOSI</text>
  <circle cx="990" cy="540" r="10" fill="#9333ea"/><text x="1020" y="547" class="pin">MISO</text>
  <circle cx="990" cy="600" r="10" fill="#ea580c"/><text x="1020" y="607" class="pin">RST</text>
  <text x="1020" y="640" class="small">IRQ：不接</text>

  <path d="M410 360 H990" stroke="#2563eb" stroke-width="8" fill="none"/>
  <path d="M410 420 H990" stroke="#16a34a" stroke-width="8" fill="none"/>
  <path d="M410 480 H990" stroke="#ca8a04" stroke-width="8" fill="none"/>
  <path d="M410 540 H990" stroke="#9333ea" stroke-width="8" fill="none"/>
  <path d="M410 600 H990" stroke="#ea580c" stroke-width="8" fill="none"/>

  <rect x="500" y="715" width="400" height="115" rx="20" fill="#fef3c7" stroke="#ca8a04" stroke-width="4"/>
  <text x="700" y="754" text-anchor="middle" class="label">外接麵包板電源模組</text>
  <text x="700" y="783" text-anchor="middle" class="small">先確認輸出設定為 3.3V</text>
  <circle cx="610" cy="800" r="10" fill="#dc2626"/><text x="630" y="807" class="pin">3.3V</text>
  <circle cx="790" cy="800" r="10" fill="#111827"/><text x="810" y="807" class="pin">GND</text>

  <path d="M610 800 V240 H990" stroke="#dc2626" stroke-width="8" fill="none"/>
  <path d="M790 800 V300 H410" stroke="#111827" stroke-width="8" fill="none"/>
  <path d="M790 300 H990" stroke="#111827" stroke-width="8" fill="none"/>
  <text x="635" y="275" class="label">外接 3.3V 只供應 RC522</text>
  <text x="635" y="335" class="label">外接電源、ESP32、RC522 共地</text>

  <rect x="70" y="855" width="1260" height="30" rx="8" fill="#fef2f2"/>
  <text x="95" y="878" class="note">不得接 5V；外接電源只接 RC522 的 3.3V／GND；僅在預設供電不足時使用。</text>
</svg>
