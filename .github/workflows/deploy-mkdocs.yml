name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "Python-ESP32-APP/docs/**"
      - "Python-ESP32-APP/mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install MkDocs
        run: python -m pip install "mkdocs-material>=9.7.7"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: >-
          mkdocs build --strict
          --config-file Python-ESP32-APP/mkdocs.yml
          --site-dir "${{ github.workspace }}/site"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
